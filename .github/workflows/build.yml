name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Read version
        id: version
        run: echo "value=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build GUI app
        run: pyinstaller --noconfirm TextureSplitter.spec

      - name: Build CLI
        run: pyinstaller --noconfirm TextureSplitterCLI.spec

      - name: Package macOS app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent TextureSplitter.app TextureSplitter-${{ steps.version.outputs.value }}-macOS.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TextureSplitter-${{ steps.version.outputs.value }}-macOS
          path: dist/TextureSplitter-${{ steps.version.outputs.value }}-macOS.zip

      - name: Upload macOS CLI
        uses: actions/upload-artifact@v4
        with:
          name: TextureSplitterCLI-${{ steps.version.outputs.value }}-macOS
          path: dist/TextureSplitterCLI

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build GUI app
        run: pyinstaller --noconfirm TextureSplitter.spec

      - name: Build CLI
        run: pyinstaller --noconfirm TextureSplitterCLI.spec

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: TextureSplitter-${{ steps.version.outputs.value }}-windows
          path: dist/TextureSplitter.exe

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: TextureSplitterCLI-${{ steps.version.outputs.value }}-windows
          path: dist/TextureSplitterCLI.exe
